name: badbaado_mobile
description: Badbaado — family & couple emergency app (Flutter).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3+1
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  socket_io_client: ^2.0.3+1
  record: ^5.1.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
